<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="hrx socket mark: one launcher body, three harness pins">
  <!-- three harness pins -->
  <rect x="52"  y="30" width="18" height="46" fill="#132548"/>
  <rect x="91"  y="30" width="18" height="46" fill="#d5ed42"/>
  <rect x="130" y="30" width="18" height="46" fill="#132548"/>
  <!-- the launcher body: one rounded socket all three seat into -->
  <rect x="40" y="70" width="120" height="96" rx="14" fill="#2454d9"/>
  <!-- a small vent/readout, the gateway's own signal -->
  <rect x="64" y="104" width="72" height="14" rx="4" fill="#eef2ff"/>
</svg>
